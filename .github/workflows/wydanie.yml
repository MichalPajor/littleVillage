# ---------------------------------------------------------------------------
# Mała wioska — pakiet AAB do Google Play
# ---------------------------------------------------------------------------
# Uruchamiany ręcznie (Actions → Wydanie → Run workflow) albo znacznikiem v1.2.3.
# Najpierw testy (w tym przejście każdego tłumaczenia razem z oryginałem), potem
# podpisany kluczem przesyłania AAB jako artefakt przebiegu — ten plik wgrywa się do Play Console.
#
# Wersja widoczna dla graczy: ze znacznika (v1.2.3 → 1.2.3) albo z pola przy ręcznym
# uruchomieniu. Kod wersji: numer przebiegu — rośnie z każdym uruchomieniem, a sklep
# odrzuca pakiet z kodem, który już kiedyś dostał.
#
# Sekrety (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    littlevillage-upload.keystore zakodowany base64
#   ANDROID_KEYSTORE_PASSWORD  hasło magazynu
#   ANDROID_KEY_PASSWORD       hasło klucza (u nas to samo)
#   ANDROID_KEY_ALIAS          littlevillage
# ---------------------------------------------------------------------------

name: Wydanie

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      wersja:
        description: 'Wersja widoczna dla graczy, np. 1.0'
        required: true
        default: '1.0'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  pakiet:
    name: Testy i pakiet AAB
    runs-on: ubuntu-latest

    env:
      MAGAZYN_KLUCZY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Pakiet bez podpisu i tak nie przejdzie przez Play Console — lepiej paść od razu.
      - name: Kontrola sekretów
        if: env.MAGAZYN_KLUCZY == ''
        run: |
          echo '::error::Brak sekretu ANDROID_KEYSTORE_BASE64 – pakietu nie da się podpisać.'
          exit 1

      - name: Ustalenie wersji
        id: wersja
        run: |
          if [ -n "${{ inputs.wersja }}" ]; then
            WERSJA="${{ inputs.wersja }}"
          else
            WERSJA="${GITHUB_REF_NAME#v}"
          fi

          echo "numer=$WERSJA" >> "$GITHUB_OUTPUT"
          echo "Wersja: $WERSJA (kod ${{ github.run_number }})"

      - name: Testy
        run: dotnet test tests/LittleVillage.Core.Tests/LittleVillage.Core.Tests.csproj --configuration Release

      - name: Workload MAUI (Android)
        run: dotnet workload install maui-android

      - name: Odtworzenie klucza podpisu
        run: echo "$MAGAZYN_KLUCZY" | base64 --decode > "$RUNNER_TEMP/klucz.keystore"

      - name: Pakiet AAB (podpisany)
        run: >
          dotnet publish src/LittleVillage/LittleVillage.csproj
          --configuration Release
          --framework net10.0-android
          -p:ApplicationDisplayVersion=${{ steps.wersja.outputs.numer }}
          -p:ApplicationVersion=${{ github.run_number }}
          -p:AndroidSigningKeyStore=$RUNNER_TEMP/klucz.keystore
          -p:AndroidSigningKeyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          -p:AndroidSigningKeyPass=${{ secrets.ANDROID_KEY_PASSWORD }}
          -p:AndroidSigningStorePass=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Usunięcie klucza podpisu
        if: always()
        run: rm -f "$RUNNER_TEMP/klucz.keystore"

      # Jeden plik o czytelnej nazwie zamiast całego katalogu wynikowego (podpisany i niepodpisany obok siebie).
      - name: Przygotowanie pakietu
        run: |
          PLIK=$(find src/LittleVillage/bin-unix/Release/net10.0-android/publish -name '*-Signed.aab' | head -1)
          if [ -z "$PLIK" ]; then
            echo '::error::Nie powstał podpisany pakiet AAB.'
            exit 1
          fi

          mkdir -p pakiet
          cp "$PLIK" "pakiet/littlevillage-${{ steps.wersja.outputs.numer }}-${{ github.run_number }}.aab"
          ls -la pakiet

      - name: Pakiet jako artefakt
        uses: actions/upload-artifact@v7
        with:
          name: littlevillage-${{ steps.wersja.outputs.numer }}-${{ github.run_number }}-aab
          path: pakiet/*.aab
          if-no-files-found: error
