<path d="M362 800C363 774.0 361 753.2 363 732.4" fill="none" stroke-width="3.1"/><circle cx="363" cy="727.2" r="9.4" fill="#A8101A" stroke-width="2.3"/><circle cx="363" cy="727.2" r="2.6" fill="#000000" stroke="none"/>
<path d="M300 760C301 738.0 299 720.4 301 702.8" fill="none" stroke-width="2.6"/><circle cx="301" cy="698.4" r="7.9" fill="#A8101A" stroke-width="2.0"/><circle cx="301" cy="698.4" r="2.2" fill="#000000" stroke="none"/>
</g>
</svg>
