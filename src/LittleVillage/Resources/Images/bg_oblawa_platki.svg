<circle cx="114" cy="415" r="1.0" fill="#FFFFFF" stroke-width="0.8"/>
<circle cx="264" cy="249" r="1.1" fill="#FFFFFF" stroke-width="0.8"/>
<circle cx="200" cy="297" r="1.2" fill="#FFFFFF" stroke-width="0.8"/>
<circle cx="229" cy="325" r="1.4" fill="#FFFFFF" stroke-width="0.8"/>
<circle cx="164" cy="394" r="1.0" fill="#FFFFFF" stroke-width="0.8"/>
<circle cx="285" cy="239" r="1.3" fill="#FFFFFF" stroke-width="0.8"/>
