<path d="M-20 256 Q23 252 66 256 Q109 260 152 256 Q195 252 238 256 Q281 260 324 256 Q367 252 410 256 C422 263 414 270 400 270 Q367 266 324 270 Q281 274 238 270 Q195 266 152 270 Q109 274 66 270 Q23 266 -20 270 C-32 270 -32 256 -20 256Z" fill="#EDEBE6" stroke-width="1.2" opacity="0.7"/>
