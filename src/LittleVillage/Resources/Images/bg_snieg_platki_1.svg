<circle cx="67" cy="232" r="1.7" fill="#FFFFFF" stroke-width="0.8"/>
<circle cx="14" cy="131" r="1.4" fill="#FFFFFF" stroke-width="0.8"/>
<circle cx="283" cy="198" r="1.6" fill="#FFFFFF" stroke-width="0.8"/>
<circle cx="142" cy="59" r="2.2" fill="#FFFFFF" stroke-width="0.8"/>
<circle cx="93" cy="133" r="2.0" fill="#FFFFFF" stroke-width="0.8"/>
<circle cx="53" cy="125" r="2.1" fill="#FFFFFF" stroke-width="0.8"/>
<circle cx="302" cy="180" r="1.3" fill="#FFFFFF" stroke-width="0.8"/>
