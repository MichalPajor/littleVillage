<?xml version="1.0" encoding="UTF-8"?>
<!-- LittleVillage — tło „zapadlina”: błędne ognie nad mokradłami (migoczą)
     Współrzędne płótna 390×844, viewBox = położenie warstwy. Animacje: Resources/Raw/backgrounds.json. -->
<svg xmlns="http://www.w3.org/2000/svg" width="122" height="50" viewBox="110 148 122 50">
<defs>
<filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
<feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
<line x1="0" y1="0" x2="0" y2="7" stroke="#000000" stroke-width="1.5"/>
</pattern>
<pattern id="hatchDense" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
<line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1.7"/>
</pattern>
<pattern id="water" width="9" height="5" patternUnits="userSpaceOnUse">
<line x1="0" y1="2.5" x2="5" y2="2.5" stroke="#000000" stroke-width="1.3"/>
</pattern>
</defs>
<g filter="url(#ink)" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
<circle cx="128" cy="170" r="5" fill="#FFFFFF" stroke-width="1.4"/>
<circle cx="128" cy="170" r="1.7" fill="#000000" stroke="none"/>
<path d="M120 170h-3M136 170h3M128 162v-3" fill="none" stroke-width="1.2"/>
<circle cx="172" cy="164" r="5" fill="#FFFFFF" stroke-width="1.4"/>
<circle cx="172" cy="164" r="1.7" fill="#000000" stroke="none"/>
<path d="M164 164h-3M180 164h3M172 156v-3" fill="none" stroke-width="1.2"/>
<circle cx="214" cy="174" r="5" fill="#FFFFFF" stroke-width="1.4"/>
<circle cx="214" cy="174" r="1.7" fill="#000000" stroke="none"/>
<path d="M206 174h-3M222 174h3M214 166v-3" fill="none" stroke-width="1.2"/>
<circle cx="150" cy="188" r="5" fill="#FFFFFF" stroke-width="1.4"/>
<circle cx="150" cy="188" r="1.7" fill="#000000" stroke="none"/>
<path d="M142 188h-3M158 188h3M150 180v-3" fill="none" stroke-width="1.2"/>
</g>
</svg>
