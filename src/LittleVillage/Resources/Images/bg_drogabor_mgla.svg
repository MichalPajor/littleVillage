<path d="M140 330 Q167 325 194 330 Q221 335 248 330 Q275 325 302 330 Q329 335 356 330 Q383 325 410 330 C422 340 414 350 400 350 Q383 345 356 350 Q329 355 302 350 Q275 345 248 350 Q221 355 194 350 Q167 345 140 350 C128 350 128 330 140 330Z" fill="#EDEBE6" stroke-width="1.8" opacity="0.85"/>
