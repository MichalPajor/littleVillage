<circle cx="52" cy="159" r="1.7" fill="#FFFFFF" stroke-width="0.8"/>
<circle cx="189" cy="233" r="1.5" fill="#FFFFFF" stroke-width="0.8"/>
<circle cx="294" cy="249" r="1.9" fill="#FFFFFF" stroke-width="0.8"/>
<circle cx="189" cy="245" r="1.2" fill="#FFFFFF" stroke-width="0.8"/>
<circle cx="172" cy="207" r="1.8" fill="#FFFFFF" stroke-width="0.8"/>
<circle cx="90" cy="220" r="1.9" fill="#FFFFFF" stroke-width="0.8"/>
<circle cx="269" cy="219" r="1.9" fill="#FFFFFF" stroke-width="0.8"/>
<circle cx="137" cy="102" r="2.2" fill="#FFFFFF" stroke-width="0.8"/>
</g>
