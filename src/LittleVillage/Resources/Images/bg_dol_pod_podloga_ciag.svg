<path d="M-9.0 432.0L2.4 432.0L2.4 435.0L-9.0 435.0Z" fill="url(#hatch)" stroke="none"/>
<path d="M386.6 433.0L400.0 433.0L400.0 455.0Q400.0 457.0 396.0 457.0Q392.1 457.0 392.1 455.0Z" fill="url(#hatch)" stroke="#EDEBE6" stroke-width="1.9"/>
<path d="M387.6 432.0L399.0 432.0L399.0 435.0L387.6 435.0Z" fill="url(#hatch)" stroke="none"/>
</g>
</svg>
