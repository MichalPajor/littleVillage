<?xml version="1.0" encoding="UTF-8"?>
<!-- LittleVillage — tło „dolny plan: roraty”: płatki śniegu
     Współrzędne płótna 390×844, viewBox = położenie warstwy. Animacje: Resources/Raw/backgrounds.json. -->
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="421" viewBox="0 423 390 421">
<defs>
