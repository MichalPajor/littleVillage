<?xml version="1.0" encoding="UTF-8"?>
<!-- LittleVillage — tło „żniwa”: żyto faluje
     Współrzędne płótna 390×844, viewBox = położenie warstwy. Animacje: Resources/Raw/backgrounds.json. -->
<svg xmlns="http://www.w3.org/2000/svg" width="52" height="60" viewBox="344 220 52 60">
<defs>
