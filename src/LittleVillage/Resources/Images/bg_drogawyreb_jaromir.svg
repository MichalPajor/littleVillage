<path d="M16 270H64" fill="none" stroke-width="2.4"/><path d="M14 270v16M66 270v16" fill="none" stroke-width="1.2"/><path d="M8 286h12l-2 10h-8zM60 286h12l-2 10h-8z" fill="#FFFFFF" stroke-width="1.2"/>
