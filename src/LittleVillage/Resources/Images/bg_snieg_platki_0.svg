<circle cx="323" cy="180" r="1.9" fill="#FFFFFF" stroke-width="0.8"/>
<circle cx="253" cy="138" r="1.4" fill="#FFFFFF" stroke-width="0.8"/>
<circle cx="284" cy="187" r="1.9" fill="#FFFFFF" stroke-width="0.8"/>
<circle cx="259" cy="164" r="1.8" fill="#FFFFFF" stroke-width="0.8"/>
<circle cx="370" cy="171" r="1.2" fill="#FFFFFF" stroke-width="0.8"/>
</g>
