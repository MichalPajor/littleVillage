<path d="M120 238 Q137 236 154 238 Q171 240 188 238 Q205 236 222 238 Q239 240 256 238 Q273 236 290 238 C302 241 294 244 280 244 Q273 242 256 244 Q239 246 222 244 Q205 242 188 244 Q171 246 154 244 Q137 242 120 244 C108 244 108 238 120 238Z" fill="#EDEBE6" stroke-width="1.6"/>
