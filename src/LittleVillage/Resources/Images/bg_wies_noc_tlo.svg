<path d="M314 110C326 126 328 146 322 160" fill="none" stroke-width="1.6"></path>
<path d="M-10 380L-10 290L5 262L12 285L22 240L34 280L44 255L56 290L70 230L84 282L96 250L108 286L122 238L136 280L148 258L160 292L176 226L190 280L202 252L214 288L230 232L246 284L258 256L270 290L286 244L300 284L312 260L326 292L342 236L356 282L368 252L380 288L392 246L400 270L400 380Z" fill="#000000" stroke-width="3"></path>
</g>
