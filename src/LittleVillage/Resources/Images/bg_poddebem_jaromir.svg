<?xml version="1.0" encoding="UTF-8"?>
<!-- LittleVillage — tło „rozmowa pod dębem”: Jaromir siedzi na korzeniu
     Współrzędne płótna 390×844, viewBox = położenie warstwy. Animacje: Resources/Raw/backgrounds.json. -->
<svg xmlns="http://www.w3.org/2000/svg" width="50" height="54" viewBox="40 296 50 54">
<defs>
<filter id="ink" filterUnits="userSpaceOnUse" x="-60" y="-60" width="520" height="980">
<feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<filter id="inkWide" filterUnits="userSpaceOnUse" x="-300" y="-300" width="1200" height="1200">
<feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
<line x1="0" y1="0" x2="0" y2="7" stroke="#000000" stroke-width="1.5"/>
</pattern>
<pattern id="hatchDense" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
<line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1.7"/>
</pattern>
<pattern id="hatchNight" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
<line x1="0" y1="0" x2="0" y2="3" stroke="#000000" stroke-width="1.9"/>
</pattern>
<pattern id="water" width="9" height="5" patternUnits="userSpaceOnUse">
<line x1="0" y1="2.5" x2="5" y2="2.5" stroke="#000000" stroke-width="1.3"/>
</pattern>
</defs>
<g filter="url(#ink)" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
<path d="M56.0 310.0C54.0 320.0 56.0 330.0 62 334.0L76.0 334.0L78.0 346.0" fill="none" stroke-width="5.0"/><circle cx="58.0" cy="304.0" r="5.0" fill="#000000" stroke-width="1"/><path d="M57.0 314.0L70.0 328.0" fill="none" stroke-width="3.0"/>
</g>
</svg>
