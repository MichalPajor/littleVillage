<path d="M370 429C369 419 372 411 371 405" fill="none" stroke-width="1.4"/>
<circle cx="371" cy="402" r="3" fill="#000000" stroke-width="1.2"/>
<path d="M383 424C382 414 385 406 384 400" fill="none" stroke-width="1.4"/>
<circle cx="384" cy="397" r="3" fill="#FFFFFF" stroke-width="1.2"/>
</g>
