<path d="M-10 250H400" fill="none" stroke-width="2"/>
<path d="M20 330V290H100V330" fill="none" stroke-width="3"/><path d="M14 290H106V298H14Z" fill="#FFFFFF" stroke-width="2"/>
<path d="M300 330V290H380V330" fill="none" stroke-width="3"/><path d="M294 290H386V298H294Z" fill="#FFFFFF" stroke-width="2"/>
