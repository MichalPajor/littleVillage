<path d="M300 520C296 560 296 600 300 640H370C374 600 374 560 370 520Z" fill="#EDEBE6" stroke="#000000" stroke-width="2.4"/><path d="M298 548H372M296 612H374" fill="none" stroke="#000000" stroke-width="3"/>
