<?xml version="1.0" encoding="UTF-8"?>
<!-- LittleVillage — prawy świerk (kołysze się)
     Warstwa tła „wies_noc” wycięta z makiety (współrzędne płótna 390×844, viewBox = położenie warstwy).
     Położenie i animację warstwy opisuje Resources/Raw/backgrounds.json. -->
<svg xmlns="http://www.w3.org/2000/svg" width="102" height="218" viewBox="324 188 102 218">
<defs>
<filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
<feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"></feTurbulence>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap>
</filter>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
<line x1="0" y1="0" x2="0" y2="7" stroke="#000000" stroke-width="1.5"></line>
</pattern>
<pattern id="hatchDense" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
<line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1.7"></line>
</pattern>
</defs>
<g filter="url(#ink)" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
<path d="M330 400L356 336L346 338L362 290L352 292L368 240L360 242L374 196L388 242L380 240L396 292L386 290L404 338L394 336L420 400Z" fill="#000000" stroke-width="3"></path>
</g>
</svg>
