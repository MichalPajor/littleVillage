<?xml version="1.0" encoding="UTF-8"?>
<!-- LittleVillage — tło „ubożę przy piecu”: izba nocą: okno z księżycem, piec, półka
     Współrzędne płótna 390×844, viewBox = położenie warstwy. Animacje: Resources/Raw/backgrounds.json. -->
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="443" viewBox="0 0 390 443">
<defs>
