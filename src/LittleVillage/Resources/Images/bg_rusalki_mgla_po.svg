<path d="M10 310 Q47 305 84 310 Q121 315 158 310 Q195 305 232 310 Q269 315 306 310 Q343 305 380 310 C392 318 384 326 370 326 Q343 321 306 326 Q269 331 232 326 Q195 321 158 326 Q121 331 84 326 Q47 321 10 326 C-2 326 -2 310 10 310Z" fill="#EDEBE6" stroke-width="1.2" opacity="0.7"/>
<path d="M10 340 Q47 335 84 340 Q121 345 158 340 Q195 335 232 340 Q269 345 306 340 Q343 335 380 340 C392 348 384 356 370 356 Q343 351 306 356 Q269 361 232 356 Q195 351 158 356 Q121 361 84 356 Q47 351 10 356 C-2 356 -2 340 10 340Z" fill="#EDEBE6" stroke-width="1.2" opacity="0.7"/>
