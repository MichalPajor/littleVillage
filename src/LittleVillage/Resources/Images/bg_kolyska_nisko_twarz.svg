<?xml version="1.0" encoding="UTF-8"?>
<!-- LittleVillage — tło „kołyska Zosi”: północnica liczy mak przy podłodze — twarz (rysunek autora; # pokaz: mak, znika przy # pokaz: kogut)
     Współrzędne płótna 390×844, viewBox = położenie warstwy. Animacje: Resources/Raw/backgrounds.json. -->
<svg xmlns="http://www.w3.org/2000/svg" width="109" height="192" viewBox="180 170 109 192">
<defs>
<filter id="ink" filterUnits="userSpaceOnUse" x="-60" y="-60" width="520" height="980">
<feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
<feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
<line x1="0" y1="0" x2="0" y2="7" stroke="#000000" stroke-width="1.5"/>
</pattern>
<pattern id="hatchDense" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
<line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1.7"/>
</pattern>
<pattern id="hatchNight" width="3" height="3" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
<line x1="0" y1="0" x2="0" y2="3" stroke="#000000" stroke-width="1.9"/>
</pattern>
<pattern id="water" width="9" height="5" patternUnits="userSpaceOnUse">
<line x1="0" y1="2.5" x2="5" y2="2.5" stroke="#000000" stroke-width="1.3"/>
</pattern>
</defs>
<g transform="matrix(0.36000 0.00000 0.00000 0.36000 180.00000 170.00000)"><g filter="url(#ink)" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
<g stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
<g id="twarz" data-anim="obrot" data-origin="150,180" data-range="2deg" data-period="4">
<path d="M126 90C118 120 120 148 134 166C142 176 158 176 166 166C180 148 182 120 174 90C166 76 134 76 126 90Z" fill="#FFFFFF" stroke-width="4"/>
<path d="M124 124C132 130 136 142 142 158M176 124C168 130 164 142 158 158" fill="none" stroke-width="2"/>
<path d="M126 122C130 136 136 148 144 160C138 150 130 136 126 122ZM174 122C170 136 164 148 156 160C162 150 170 136 174 122Z" fill="url(#hatchDense)" stroke="none"/>
<ellipse cx="139" cy="110" rx="8" ry="11" fill="#000000" stroke-width="2"/>
<ellipse cx="161" cy="110" rx="8" ry="11" fill="#000000" stroke-width="2"/>
<!-- oczy (punkty): mruganie = skala Y 1→0 na 0.1 s co 3–6 s, origin 150,112; przy wpatrywaniu można je powiększyć do r=3 -->
<g id="oczy" data-anim="mruganie" data-origin="150,112" data-range="1-0" data-period="3-6">
<circle cx="139" cy="112" r="2" fill="#FFFFFF" stroke="none"/>
<circle cx="161" cy="112" r="2" fill="#FFFFFF" stroke="none"/>
</g>
<path d="M128 96C134 90 146 92 148 98M152 98C154 92 166 90 172 96" fill="none" stroke-width="2.6"/>
<path d="M150 116L148 132L153 132" fill="none" stroke-width="2"/>
<!-- usta: otwieranie = skala Y 1.0→1.8 przy origin 150,144 (krzyk), zamknięte = 0.4 -->
<g id="usta" data-anim="skala" data-origin="150,144" data-range="0.4-1.8" data-period="-">
<path d="M136 146C142 142 158 142 164 146C158 156 142 156 136 146Z" fill="#000000" stroke-width="2"/>
<path d="M140 146l1 5M146 145l0 6M152 145l0 6M158 146l-1 5" fill="none" stroke="#FFFFFF" stroke-width="1.3"/>
</g>
<path d="M146 174C136 180 130 190 130 200L170 200C170 190 164 180 154 174Z" fill="#FFFFFF" stroke-width="3.5"/>
</g>
</g>
</g></g>
</svg>
