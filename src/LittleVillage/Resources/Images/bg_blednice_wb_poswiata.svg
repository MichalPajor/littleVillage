<circle cx="66" cy="408" r="28.9" fill="none" stroke-width="1.2" stroke-dasharray="3 6"/>
<circle cx="66" cy="408" r="38.9" fill="none" stroke-width="1" stroke-dasharray="2 9"/>
<circle cx="238" cy="392" r="38.4" fill="none" stroke-width="1.2" stroke-dasharray="3 6"/>
<circle cx="238" cy="392" r="50.8" fill="none" stroke-width="1" stroke-dasharray="2 9"/>
