<path d="M218.30651137123078 121.90256417074242q1.8 -2.1 3.6 0q1.8 -2.1 3.6 0q-1.8 -0.9 -3.6 1.5q-1.8 -2.4 -3.6 -1.5z" fill="#000000" stroke-width="1"/>
