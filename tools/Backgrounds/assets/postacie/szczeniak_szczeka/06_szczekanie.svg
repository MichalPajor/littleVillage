<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400">
<!-- szczekanie: kreski dźwięku przed pyskiem: pojawiają się i rosną skalą 0.8→1.2 przy origin ok. 70,150 (po przeliczeniu) w rytm każdego szczeknięcia -->
<defs>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><line x1="0" y1="0" x2="0" y2="7" stroke="#000000" stroke-width="1.6"/></pattern>
<pattern id="hatchDense" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1.8"/></pattern>
</defs>
<g stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
<g id="szczekanie" data-anim="skala" data-origin="70,150" data-range="0.8-1.2" data-period="0.3">
<g transform="translate(70 0)">
<path d="M28 132L2 118M24 148L-8 148M28 164L2 180" fill="none" stroke-width="4.5"/>
<path d="M-20 108L-34 98M-30 148L-48 148M-20 190L-34 200" fill="none" stroke-width="3"/>
</g>
</g>
</g>
</svg>
