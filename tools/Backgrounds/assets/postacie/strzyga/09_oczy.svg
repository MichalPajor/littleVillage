<svg xmlns="http://www.w3.org/2000/svg" width="300" height="530" viewBox="32 70 260 460">
<!-- oczy: drobne, jasne punkty w głębi skośnych oczodołów; mruganie = skala Y 1→0 na 0.08 s co 3–6 s, origin 252,160; przy ataku powiększają się skalą 1.0→1.6 -->
<defs>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><line x1="0" y1="0" x2="0" y2="7" stroke="#000000" stroke-width="1.6"/></pattern>
<pattern id="hatchDense" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1.8"/></pattern>
</defs>
<g stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
<g id="oczy" data-anim="mruganie" data-origin="252,160" data-range="1-0" data-period="3-6">
<circle cx="245" cy="160" r="2.2" fill="#FFFFFF" stroke="none"/>
<circle cx="266" cy="160" r="1.5" fill="#FFFFFF" stroke="none"/>
</g>
</g>
</svg>
