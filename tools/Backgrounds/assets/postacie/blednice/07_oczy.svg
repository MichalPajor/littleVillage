<svg xmlns="http://www.w3.org/2000/svg" width="300" height="530" viewBox="0 0 300 530">
<!-- oczy palaczy wiedźmy (czerwone kropki): w każdej kuli dwie; przesuwają się razem ze swoją kulą; mruganie = krycie 1→0 na 0.1 s co 3–7 s, różne fazy dla każdej pary; mogą się żarzyć skalą 0.8–1.3 -->
<defs>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><line x1="0" y1="0" x2="0" y2="7" stroke="#000000" stroke-width="1.6"/></pattern>
<pattern id="hatchDense" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1.8"/></pattern>
</defs>
<g stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
<g id="oczy" data-anim="mruganie" data-origin="150,250" data-range="1-0" data-period="3-7">
<g transform="rotate(-12 143 206)"><circle cx="140.8" cy="204.2" r="1.4" fill="#A8101A" stroke="none"/><circle cx="147" cy="203.6" r="1.4" fill="#A8101A" stroke="none"/></g>
<circle cx="55.8" cy="118.0" r="2.0" fill="#A8101A" stroke-width="0.8"/>
<circle cx="68.2" cy="118.0" r="2.0" fill="#A8101A" stroke-width="0.8"/>
<circle cx="234.2" cy="104.0" r="2.5" fill="#A8101A" stroke-width="0.8"/>
<circle cx="249.8" cy="104.0" r="2.5" fill="#A8101A" stroke-width="0.8"/>
<circle cx="61.2" cy="408.0" r="1.6" fill="#A8101A" stroke-width="0.8"/>
<circle cx="70.8" cy="408.0" r="1.6" fill="#A8101A" stroke-width="0.8"/>
<circle cx="231.3" cy="392.0" r="2.2" fill="#A8101A" stroke-width="0.8"/>
<circle cx="244.7" cy="392.0" r="2.2" fill="#A8101A" stroke-width="0.8"/>
</g>
</g>
</svg>
