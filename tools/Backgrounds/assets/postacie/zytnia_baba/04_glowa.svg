<path d="M150.0 60C148.0 90 152.0 120 150.0 148" fill="none" stroke-width="1"/>
<path d="M156.5 60C154.5 90 158.5 120 153.2 148" fill="none" stroke-width="1"/>
<path d="M163.0 60C161.0 90 165.0 120 156.5 148" fill="none" stroke-width="1"/>
<path d="M169.5 60C167.5 90 171.5 120 159.8 148" fill="none" stroke-width="1"/>
<path d="M176.0 60C174.0 90 178.0 120 163.0 148" fill="none" stroke-width="1"/>
<g transform="rotate(0 150 62)"><rect x="128.0" y="57" width="44" height="10" fill="#EDEBE6" stroke-width="2.6"/><path d="M131.0 57l4 10" fill="none" stroke-width="1.4"/><path d="M137.0 57l4 10" fill="none" stroke-width="1.4"/><path d="M143.0 57l4 10" fill="none" stroke-width="1.4"/><path d="M149.0 57l4 10" fill="none" stroke-width="1.4"/><path d="M155.0 57l4 10" fill="none" stroke-width="1.4"/><path d="M161.0 57l4 10" fill="none" stroke-width="1.4"/><path d="M167.0 57l4 10" fill="none" stroke-width="1.4"/></g>
<!-- twarz ze słomy: trzy czarne dziury — oczy i usta, bez nosa; "mruganie" = dziury oczu zwężają się skalą Y 1→0.3 co 6–10 s (origin 150,98); usta otwierają się skalą Y 1→1.5 przy origin 150,128 -->
<g id="oczy" data-anim="skala" data-origin="150,98" data-range="1-0.3" data-period="6-10">
<path d="M128 98C130 88 142 88 144 98C142 108 130 108 128 98Z" fill="#000000" stroke-width="2"/>
<path d="M156 98C158 88 170 88 172 98C170 108 158 108 156 98Z" fill="#000000" stroke-width="2"/>
</g>
<g id="usta" data-anim="skala" data-origin="150,128" data-range="1-1.5" data-period="-">
<path d="M142 124C144 116 156 116 158 124C158 134 154 140 150 140C146 140 142 134 142 124Z" fill="#000000" stroke-width="2"/>
</g>
<path d="M128 98l-4 -2M144 98l3 -3M156 98l-3 -3M172 98l4 -2M142 128l-4 2M158 128l4 2" fill="none" stroke-width="1.2"/>
</g>
</g>
</svg>
