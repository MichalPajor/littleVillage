<svg xmlns="http://www.w3.org/2000/svg" width="300" height="530" viewBox="0 0 300 530">
<!-- głowa ze słomy: przechyla się ±3° przy origin 150,150 (powrósło na szyi), okres 4 s; zawiera podgrupy oczy i usta (trzy czarne dziury) -->
<defs>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><line x1="0" y1="0" x2="0" y2="7" stroke="#000000" stroke-width="1.6"/></pattern>
<pattern id="hatchDense" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1.8"/></pattern>
</defs>
<g stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
<g id="glowa" data-anim="obrot" data-origin="150,150" data-range="3deg" data-period="4">
<path d="M118 104C116 74 130 56 150 56C170 56 184 74 182 104C180 126 168 146 150 150C132 146 120 126 118 104Z" fill="#EDEBE6" stroke-width="4"/>
<path d="M170 64C184 80 186 110 176 132C170 142 162 148 156 150C170 134 176 110 170 64Z" fill="url(#hatch)" stroke="none"/>
<path d="M124.0 60C122.0 90 126.0 120 137.0 148" fill="none" stroke-width="1"/>
<path d="M130.5 60C128.5 90 132.5 120 140.2 148" fill="none" stroke-width="1"/>
<path d="M137.0 60C135.0 90 139.0 120 143.5 148" fill="none" stroke-width="1"/>
