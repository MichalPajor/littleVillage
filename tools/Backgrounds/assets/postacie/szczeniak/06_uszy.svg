<svg xmlns="http://www.w3.org/2000/svg" width="400" height="430" viewBox="0 0 400 430">
<!-- uszy: uszy: strzyżenie = obrót ±6° każdego ucha przy nasadach (148,110 i 252,110), okres 2.5 s; razem z głową -->
<defs>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><line x1="0" y1="0" x2="0" y2="7" stroke="#000000" stroke-width="1.6"/></pattern>
<pattern id="hatchDense" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><line x1="0" y1="0" x2="0" y2="4" stroke="#000000" stroke-width="1.8"/></pattern>
</defs>
<g stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
<g id="uszy" data-anim="obrot" data-origin="200,110" data-range="6deg" data-period="2.5">
<path d="M140 116C128 82 126 50 134 20C156 38 176 62 184 88Z" fill="#EDEBE6" stroke-width="5"/>
<path d="M148 102C142 80 140 62 142 44C154 58 164 72 172 90Z" fill="#000000" stroke-width="2"/>
<path d="M260 116C272 82 274 50 266 20C244 38 224 62 216 88Z" fill="#EDEBE6" stroke-width="5"/>
<path d="M252 102C258 80 260 62 258 44C246 58 236 72 228 90Z" fill="#000000" stroke-width="2"/>
</g>
</g>
</svg>
