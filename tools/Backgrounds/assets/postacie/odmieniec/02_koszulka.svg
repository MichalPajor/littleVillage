<path d="M150 226V246M146 232h8M146 240h8" fill="none" stroke-width="1.4"/>
<path d="M126 260C122 300 118 350 114 392M150 270C150 310 150 360 150 400M174 260C178 300 182 350 186 392" fill="none" stroke-width="1.6"/>
<path d="M98 360C120 368 180 368 202 360" fill="none" stroke-width="1.4" stroke-dasharray="4 4"/>
</g>
</g>
</svg>
